name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run Python tests
        run: uv run --no-sync python -m unittest discover -s tests -v

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Run Spring Boot tests
        working-directory: backend
        run: ./gradlew test --no-daemon

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check browser scripts
        run: |
          node --check web/app.js
          node --check web/presentation.js

      - name: Run JavaScript tests
        run: node --test tests/test_presentation.cjs

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build CPU runtime image
        run: docker build --tag llm-edu-rag:test .

      - name: Check image user and runtime imports
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' llm-edu-rag:test)" = "app"
          docker run --rm --entrypoint python llm-edu-rag:test -c \
            "import sys, torch; sys.path.insert(0, '/app/src'); import search_app; assert torch.version.cuda is None; print(search_app.app.title)"

  publish-image:
    # 테스트와 이미지 검증이 모두 통과한 main 브랜치 푸시만 GHCR에 게시한다.
    needs: [unit-tests, container-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push CPU runtime image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --tag "$image:${GITHUB_SHA::12}" --tag "$image:latest" .
          docker push "$image:${GITHUB_SHA::12}"
          docker push "$image:latest"
