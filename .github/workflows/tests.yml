name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run Python tests
        run: uv run --no-sync python -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check browser scripts
        run: |
          node --check web/app.js
          node --check web/presentation.js

      - name: Run JavaScript tests
        run: node --test tests/test_presentation.cjs

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build CPU runtime image
        run: docker build --tag llm-edu-rag:test .

      - name: Check image user and runtime imports
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' llm-edu-rag:test)" = "app"
          docker run --rm --entrypoint python llm-edu-rag:test -c \
            "import sys, torch; sys.path.insert(0, '/app/src'); import search_app; assert torch.version.cuda is None; print(search_app.app.title)"
