[project]
name = "llm-edu-rag"
version = "0.1.0"
description = "Local-first retrieval and cited RAG experiments for Korean education documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "huggingface-hub>=0.20.0",
    "kiwipiepy>=0.23.2",
    "pymupdf4llm>=0.0.27",
    "qdrant-client>=1.17.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.0",
    "torch>=2.1.0",
    "transformers>=4.38.1",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx2>=0.1.0",
    "pyyaml>=6.0.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.urls]
Repository = "https://github.com/CHUSEOYOUNG/llm-edu-rag"
